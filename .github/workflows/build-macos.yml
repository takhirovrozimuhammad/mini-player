name: Build and Publish macOS Preview

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build native app and DMG
        run: bash scripts/build-dmg.sh
      - name: Validate bundle and DMG
        run: |
          test -x dist/GlassNeedle.app/Contents/MacOS/GlassNeedle
          codesign --verify --deep --strict --verbose=2 dist/GlassNeedle.app
          hdiutil verify dist/GlassNeedle-v0.3.0-macOS.dmg
          cd dist && shasum -a 256 -c SHA256SUMS.txt
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassNeedle-macOS-preview
          path: |
            dist/GlassNeedle-v0.3.0-macOS.dmg
            dist/GlassNeedle-v0.3.0-macOS.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish a prerelease (push to main) or tagged release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=""
          else
            TAG="v0.3.0-preview"
            PRERELEASE="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/GlassNeedle-v0.3.0-macOS.dmg dist/GlassNeedle-v0.3.0-macOS.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/GlassNeedle-v0.3.0-macOS.dmg dist/GlassNeedle-v0.3.0-macOS.zip dist/SHA256SUMS.txt --title "GlassNeedle $TAG" --target "$GITHUB_SHA" $PRERELEASE --notes "Experimental macOS native preview. Ad-hoc signed, not Apple-notarized; real-world QA pending. Does not unlock macOS or draw on its secure lock screen."
          fi
